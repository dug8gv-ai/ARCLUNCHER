<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#04061a" />
  <title>ArcOmni Pro — Offline</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@400;600;700&display=swap');

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #04061a;
      color: #e8eeff;
      font-family: 'Rajdhani', sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      min-height: 100dvh;
      padding: 2rem;
      text-align: center;
      overflow: hidden;
    }

    /* Subtle animated gradient orb behind logo */
    body::before {
      content: '';
      position: absolute;
      width: 340px;
      height: 340px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(245,158,11,0.15) 0%, transparent 70%);
      top: 50%;
      left: 50%;
      transform: translate(-50%, -60%);
      animation: pulse-glow 4s ease-in-out infinite;
      pointer-events: none;
      z-index: 0;
    }

    @keyframes pulse-glow {
      0%, 100% { opacity: 0.5; transform: translate(-50%, -60%) scale(1); }
      50% { opacity: 1; transform: translate(-50%, -60%) scale(1.15); }
    }

    .container {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1.5rem;
      max-width: 380px;
    }

    .logo {
      width: 100px;
      height: 100px;
      border-radius: 22px;
      object-fit: cover;
      box-shadow: 0 0 40px rgba(245,158,11,0.2);
    }

    h1 {
      font-family: 'Orbitron', sans-serif;
      font-weight: 900;
      font-size: 1.5rem;
      letter-spacing: 0.06em;
      background: linear-gradient(135deg, #f59e0b 0%, #d97706 50%, #f59e0b 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    p {
      color: rgba(232,238,255,0.6);
      font-size: 1rem;
      line-height: 1.6;
      font-weight: 500;
    }

    .retry-btn {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.75rem 2rem;
      border: 1px solid rgba(245,158,11,0.4);
      border-radius: 12px;
      background: rgba(245,158,11,0.08);
      color: #f59e0b;
      font-family: 'Rajdhani', sans-serif;
      font-weight: 700;
      font-size: 0.95rem;
      letter-spacing: 0.05em;
      cursor: pointer;
      transition: all 0.25s ease;
      text-decoration: none;
      margin-top: 0.5rem;
    }

    .retry-btn:hover {
      background: rgba(245,158,11,0.18);
      border-color: #f59e0b;
      box-shadow: 0 0 20px rgba(245,158,11,0.15);
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #ef4444;
      animation: blink 2s ease-in-out infinite;
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }

    .footer {
      position: fixed;
      bottom: 1.5rem;
      left: 0;
      right: 0;
      text-align: center;
      font-size: 0.75rem;
      color: rgba(232,238,255,0.25);
      letter-spacing: 0.08em;
      font-family: 'Orbitron', sans-serif;
    }
  </style>
</head>
<body>
  <div class="container">
    <img src="/main-logo.jpg" alt="ArcOmni" class="logo" />
    <h1>YOU'RE OFFLINE</h1>
    <p>
      No internet connection detected.<br />
      Check your network and try again to access ArcOmni Pro.
    </p>
    <button class="retry-btn" onclick="window.location.reload()">
      <span class="status-dot"></span>
      RETRY CONNECTION
    </button>
  </div>
  <div class="footer">ARCOMNI PRO v1.0</div>
</body>
</html>
